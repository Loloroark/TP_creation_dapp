<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="fleche-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Architecture trois tiers — Application de gestion de tickets</text>

  <!-- Zone Scalingo -->
  <rect x="210" y="70" width="670" height="300" rx="14" fill="#f3f6fd" stroke="#2f6feb" stroke-dasharray="6 4"/>
  <text x="230" y="96" font-size="15" font-weight="700" fill="#2f6feb">Scalingo — région osc-fr1 (HTTPS)</text>

  <!-- Navigateur -->
  <rect x="20" y="170" width="160" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="100" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Navigateur</text>
  <text x="100" y="230" text-anchor="middle" font-size="13" fill="#656d76">Utilisateur</text>
  <text x="100" y="248" text-anchor="middle" font-size="13" fill="#656d76">(collaborateur)</text>

  <!-- Tier 1 : Frontend -->
  <rect x="235" y="130" width="190" height="150" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="330" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">TIER 1 — PRÉSENTATION</text>
  <text x="330" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Frontend</text>
  <text x="330" y="204" text-anchor="middle" font-size="13" fill="#656d76">App « tickets-front »</text>
  <text x="330" y="224" text-anchor="middle" font-size="13" fill="#656d76">HTML / CSS / JS</text>
  <text x="330" y="244" text-anchor="middle" font-size="13" fill="#656d76">Express (fichiers statiques)</text>
  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#8a8f98">env : API_URL</text>

  <!-- Tier 2 : Backend -->
  <rect x="455" y="130" width="190" height="150" rx="10" fill="#ffffff" stroke="#bf8700" stroke-width="2"/>
  <text x="550" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#bf8700">TIER 2 — LOGIQUE MÉTIER</text>
  <text x="550" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Backend (API REST)</text>
  <text x="550" y="204" text-anchor="middle" font-size="13" fill="#656d76">App « tickets-api »</text>
  <text x="550" y="224" text-anchor="middle" font-size="13" fill="#656d76">Node.js 22 + Express</text>
  <text x="550" y="244" text-anchor="middle" font-size="13" fill="#656d76">Validation, CORS, /health</text>
  <text x="550" y="262" text-anchor="middle" font-size="11" fill="#8a8f98">env : SCALINGO_POSTGRESQL_URL</text>
  <text x="550" y="276" text-anchor="middle" font-size="11" fill="#8a8f98">CORS_ORIGIN</text>

  <!-- Tier 3 : BDD -->
  <rect x="675" y="130" width="190" height="150" rx="10" fill="#ffffff" stroke="#d1242f" stroke-width="2"/>
  <text x="770" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#d1242f">TIER 3 — DONNÉES</text>
  <text x="770" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">PostgreSQL</text>
  <text x="770" y="204" text-anchor="middle" font-size="13" fill="#656d76">Addon Scalingo</text>
  <text x="770" y="224" text-anchor="middle" font-size="13" fill="#656d76">Table « tickets »</text>
  <text x="770" y="244" text-anchor="middle" font-size="13" fill="#656d76">CHECK sur le statut</text>
  <text x="770" y="266" text-anchor="middle" font-size="12" fill="#8a8f98">accès réservé au backend</text>

  <!-- Flux -->
  <line x1="180" y1="205" x2="233" y2="205" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="206" y="196" text-anchor="middle" font-size="11" fill="#444">1. HTTPS</text>

  <path d="M100,270 C100,340 550,340 550,282" fill="none" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="330" y="352" text-anchor="middle" font-size="12" fill="#444">2. fetch() HTTPS — JSON (GET / POST / PATCH /api/tickets)</text>

  <line x1="645" y1="205" x2="673" y2="205" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="660" y="122" text-anchor="middle" font-size="11" fill="#444">3. SQL</text>
  <line x1="660" y1="126" x2="660" y2="198" stroke="#444" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- CI/CD -->
  <rect x="20" y="420" width="200" height="90" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="120" y="455" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Développeurs</text>
  <text x="120" y="478" text-anchor="middle" font-size="13" fill="#656d76">git commit + git push</text>

  <rect x="330" y="420" width="220" height="90" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="440" y="455" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">GitHub</text>
  <text x="440" y="478" text-anchor="middle" font-size="13" fill="#656d76">Dépôt (backend/ + frontend/)</text>

  <line x1="220" y1="465" x2="328" y2="465" stroke="#444" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="274" y="456" text-anchor="middle" font-size="11" fill="#444">push</text>

  <line x1="550" y1="465" x2="660" y2="465" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="660" y1="465" x2="660" y2="373" stroke="#8a8f98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#fleche-gris)"/>
  <text x="672" y="440" font-size="12" fill="#656d76">Déploiement automatique</text>
  <text x="672" y="458" font-size="12" fill="#656d76">(CI/CD) des 2 apps</text>
  <text x="672" y="476" font-size="12" fill="#656d76">PROJECT_DIR=frontend / backend</text>

  <text x="450" y="545" text-anchor="middle" font-size="12" fill="#8a8f98">Les secrets (URL de la base) restent dans les variables d'environnement Scalingo de l'API — jamais dans le dépôt ni dans le frontend.</text>
</svg>
